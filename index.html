    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(v) {
              _fetch = v;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // No-op if environment restricts defineProperty
        }
      })();
    </script>
